# Spring Boot Interview demo - in-memory H2 database so it runs with zero setup.

spring.application.name=spring-boot-interview-demo

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console - open http://localhost:8080/h2-console while the app runs
# JDBC URL: jdbc:h2:mem:employeedb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
